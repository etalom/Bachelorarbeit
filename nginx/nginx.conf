events {}

http {
    upstream streamlit {
        server streamlit:8501;
    }

    upstream rag-api {
        server rag-api:8000;
    }

    server {
        listen 80;

        location / {
            proxy_pass         http://streamlit;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
        }

        location /api/ {
            rewrite            ^/api/(.*)$ /$1 break;
            proxy_pass         http://rag-api;
            proxy_set_header   Host $host;
        }
    }
}

